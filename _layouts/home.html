---
layout: default
---

<!-- HERO -->
<section id="hero">
  <div class="hero-accent-bar"></div>
  <div class="hero-shape"></div>
  <div class="hero-dots"></div>
  <div class="hero-inner">
    <div class="hero-content">
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        {{ site.data.home.hero.badge }}
      </div>
      <h1 class="hero-title">{{ site.data.home.hero.title }}</h1>
      <p class="hero-sub">{{ site.data.home.hero.subtitle }}</p>
      <div class="hero-actions">
        <a href="#experiences" class="btn-primary">Voir mes expériences</a>
        <a href="{{ site.data.home.contact.cv_url }}" class="btn-secondary" target="_blank" rel="noopener noreferrer">Mon CV</a>
      </div>
      <div class="hero-stats">
        {% for stat in site.data.home.stats %}
        <div class="stat-item">
          <div class="stat-num">{{ stat.value }}</div>
          <div class="stat-label">{{ stat.label }}</div>
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="hero-photo-wrap">
      <div class="hero-photo-frame">
        <div class="hero-photo-bg"></div>
        <img src="{{ site.baseurl }}/{{ site.data.home.hero.photo }}" alt="Photo de profil Kévin Massat" class="hero-photo" loading="eager">
        <div class="hero-photo-badge">{{ site.data.home.hero.badge_disponible }}</div>
      </div>
    </div>
  </div>
</section>

<!-- Le reste de ton contenu index ici -->
{{ content }}
