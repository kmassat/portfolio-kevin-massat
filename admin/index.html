    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // INJECTION DIRECTE DE VOS STYLES DANS LA PREVISUALISATION SVELTIA
      CMS.registerPreviewStyle(`
        body { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
          background: #FFFFFF; 
          color: #272727; 
          line-height: 1.6; 
          padding: 2rem;
        }
        h1, h2, h3 { 
          font-family: 'Bricolage Grotesque', sans-serif; 
          font-weight: 800; 
          color: #272727; 
        }
        h1 { font-size: 2.5rem; border-bottom: 4px solid #FFCD00; padding-bottom: 0.5rem; }
        h2 { font-size: 1.8rem; margin-top: 2rem; }
        strong { font-weight: 600; color: #000000; }
      `, { raw: true });
      // CALCUL AUTOMATIQUE DES ANNEES D'EXPERIENCE (Mise à jour chaque 1er Janvier)
document.addEventListener('DOMContentLoaded', function(){
  var currentYear = new Date().getFullYear();
  document.querySelectorAll('.skill-years[data-start]').forEach(function(el){
    var startYear = parseInt(el.getAttribute('data-start'), 10);
    var diff = currentYear - startYear;
    if(diff > 0){
      el.textContent = diff + (diff > 1 ? ' ans' : ' an');
    }
  });
});
    </script>
  </body>
