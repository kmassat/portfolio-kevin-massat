backend:
  name: github
  repo: kmassat/portfolio-kevin-massat
  branch: main # (Si votre branche principale s'appelle master, changez main en master)

media_folder: "images" 
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    folder: "pages"
    create: true 
    slug: "{{slug}}" 
    fields:
      - { label: "Titre de la page", name: "title", widget: "string" }
      - { label: "Image principale", name: "image", widget: "image", required: false }
      - { label: "Contenu / Texte", name: "body", widget: "markdown" }