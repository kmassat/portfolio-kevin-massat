backend:
  name: github
  repo: TON-USERNAME-GITHUB/portfolio-kevin-massat
  branch: main

media_folder: "Images"
public_folder: "/Images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "accueil"
        label: "Page d'accueil"
        file: "content/accueil.json"
        fields:
          - {label: "Titre hero", name: "hero_title", widget: "string"}
          - {label: "Sous-titre hero", name: "hero_subtitle", widget: "text"}
          - {label: "Photo de profil Kévin Massat", name: "hero_photo", widget: "image"}
          - {label: "Badge disponibilité", name: "hero_badge", widget: "string"}

      - name: "groupe_cta"
        label: "Groupe CTA"
        file: "content/groupe_cta.json"
        fields:
          - {label: "Titre du poste", name: "job_title", widget: "string"}
          - {label: "Description entreprise", name: "company_desc", widget: "markdown"}
          - {label: "Image bannière", name: "banner", widget: "image"}

      - name: "ca_sud_med"
        label: "Crédit Agricole"
        file: "content/ca_sud_med.json"
        fields:
          - {label: "Titre du poste", name: "job_title", widget: "string"}
          - {label: "Description entreprise", name: "company_desc", widget: "markdown"}
          - {label: "Image bannière", name: "banner", widget: "image"}

  - name: "settings"
    label: "Paramètres"
    files:
      - name: "couleurs"
        label: "Couleurs du site"
        file: "content/settings.json"
        fields:
          - {label: "Couleur principale", name: "primary_color", widget: "color", default: "#FFCD00"}
          - {label: "Couleur sombre", name: "dark_color", widget: "color", default: "#272727"}
