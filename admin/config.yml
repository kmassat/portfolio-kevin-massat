backend:
  name: github
  # IMPORTANT : Remplacez par votre vrai identifiant et le nom de votre dépôt GitHub
  # Exemple : mon-pseudo/mon-site-web
  repo: VOTRE_PSEUDO_GITHUB/VOTRE_DEPOT_GITHUB
  branch: main # Mettez 'master' si votre branche s'appelle master

media_folder: "images" 
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    folder: "pages"
    create: true 
    slug: "{{slug}}" 
    fields:
      - { label: "Titre de la page", name: "title", widget: "string" }
      - { label: "Image principale", name: "image", widget: "image", required: false }
      - { label: "Contenu / Texte", name: "body", widget: "markdown" }