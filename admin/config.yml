  # 3. EXPERIENCES (Pages complètes avec Audit SEO)
  - name: "experiences"
    label: "⭐ Mes Expériences"
    folder: "_experiences"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Balise Titre SEO (max 60 caractères)", name: "meta_title", widget: "string", pattern: ['^.{1,60}$', "Le titre SEO est trop long ! Saisissez moins de 60 caractères."] }
      - { label: "Méta Description (max 160 caractères)", name: "meta_description", widget: "text", pattern: ['^[\s\S]{1,160}$', "La description dépasse 160 caractères !"] }
      
      - { label: "Nom court (ex: Crédit Agricole)", name: "company_short", widget: "string" }
      - { label: "Logo Principal", name: "logo", widget: "image" }
      - { label: "Second Logo (Optionnel - ex: Le Village by CA)", name: "logo2", widget: "image", required: false }
      - { label: "Bannière de fond (Hero)", name: "hero_bg", widget: "image" }
      - { label: "Votre Rôle / Poste", name: "role", widget: "string" }
      - { label: "Nom complet & lieu", name: "company", widget: "string" }
      - { label: "Période", name: "period", widget: "string" }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Type de contrat", name: "contract_type", widget: "string" }
      - { label: "Classe couleur du contrat (type-cdd, type-alt, type-stage, type-benevolat)", name: "contract_class", widget: "select", options: ["type-cdd", "type-alt", "type-stage", "type-benevolat"] }

      - { label: "Sur-titre Présentation", name: "pres_label", widget: "string" }
      - { label: "Titre Présentation", name: "pres_title", widget: "string" }
      - { label: "Texte de présentation (HTML autorisé pour <p> et <strong>)", name: "pres_text", widget: "text" }
      - { label: "Image de présentation", name: "pres_img", widget: "string" }

      - { label: "Sur-titre Entités", name: "entites_label", widget: "string", required: false }
      - { label: "Titre Entités", name: "entites_title", widget: "string", required: false }
      - { label: "Intro Entités", name: "entites_intro", widget: "text", required: false }
      - label: "Liste des agences / entités"
        name: "entites"
        widget: "list"
        required: false
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Description", name: "desc", widget: "text" }
          - { label: "Logo (Image)", name: "logo", widget: "image", required: false }
          - { label: "OU Icône SVG pure (code <path...>)", name: "svg_icon", widget: "string", required: false }
          - { label: "Code marque CSS (ex: sop, meeting...)", name: "brand_code", widget: "string", required: false }
          - { label: "Logo horizontal large ?", name: "is_wide", widget: "boolean", default: false }

      - { label: "Sur-titre Missions", name: "missions_label", widget: "string" }
      - { label: "Titre Missions", name: "missions_title", widget: "string" }
      - { label: "Intro Missions", name: "missions_intro", widget: "text" }
      - label: "Liste des missions"
        name: "missions"
        widget: "list"
        fields:
          - { label: "Numéro (ex: 01)", name: "num", widget: "string" }
          - { label: "Titre de la mission", name: "title", widget: "string" }
          - { label: "Description de la mission", name: "desc", widget: "text" }
          - { label: "Code SVG au survol (code <path...>)", name: "svg_icon", widget: "string", required: false }

      - label: "Liste des ressources / liens"
        name: "ressources"
        widget: "list"
        required: false
        fields:
          - { label: "Nom du bouton", name: "label", widget: "string" }
          - { label: "URL du site", name: "url", widget: "string" }
          - { label: "Classe CSS spécifique (ex: resource-ca, resource-village)", name: "custom_class", widget: "string", required: false }
          - { label: "Couleur CSS (ex: #CB1F48)", name: "color", widget: "string", required: false }

      - { label: "URL de la page PRECEDENTE (ex: groupe_cta.html)", name: "prev_url", widget: "string", required: false }
      - { label: "Titre de la page PRECEDENTE", name: "prev_title", widget: "string", required: false }
      - { label: "Couleur survol PRECEDENTE (ex: #272727)", name: "prev_color", widget: "string", required: false }

      - { label: "URL de la page SUIVANTE (ex: lmoc.html)", name: "next_url", widget: "string", required: false }
      - { label: "Titre de la page SUIVANTE", name: "next_title", widget: "string", required: false }
      - { label: "Couleur survol SUIVANTE (ex: #020065)", name: "next_color", widget: "string", required: false }
