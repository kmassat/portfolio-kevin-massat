badge: "Disponible très prochainement · Toulouse"
titre: "Kévin Massat,<br>chargé de <em>communication</em>"
sous_titre: "Proactif et dynamique, j'optimise la communication et la stratégie marketing de structures variées — en faisant preuve d'adaptabilité, d'autonomie et de réactivité."
lien_cv: "https://acrobat.adobe.com/id/urn:aaid:sc:EU:18551f05-b2a7-45f2-8be4-f11be752ca26"
apropos_1: "Passionné de communication depuis mes premières années d'études, j'ai eu la chance de traverser des univers très différents — du <strong>sport associatif</strong> au <strong>monde bancaire</strong>, en passant par <strong>l'événementiel et le voyage</strong> avec le Groupe CTA. Chaque secteur m'a appris une chose essentielle : adapter le message à son audience est toujours plus efficace qu'un contenu générique."
apropos_2: "Mes formations (<strong>Master Management du sport, option Communication digitale</strong> au TSM, puis <strong>MBA Communication et Marketing Digital</strong> à l'ISCOM Toulouse) m'ont donné une solide base théorique. C'est sur le terrain que j'ai développé mes réflexes : gérer l'imprévu, produire vite, collaborer efficacement."
apropos_3: "Aujourd'hui disponible pour un CDI, je cherche une structure où la communication est prise au sérieux — et où je peux continuer à apprendre et à m'investir pleinement."
