apropos_1: "Passionné de communication depuis mes premières années d'études, j'ai eu la chance de traverser des univers très différents : du <strong>sport associatif</strong> au <strong>monde bancaire</strong>, en passant par <strong>l'événementiel et le voyage</strong> avec le Groupe CTA. Chaque secteur m'a appris une chose essentielle : adapter le message à son audience est toujours plus efficace qu'un contenu générique."
apropos_2: "Mes formations (<strong>Master Management du sport, option Communication digitale</strong> au TSM, puis <strong>MBA Communication et Marketing Digital</strong> à l'ISCOM Toulouse) m'ont donné une solide base théorique. C'est sur le terrain que j'ai développé mes réflexes : gérer l'imprévu, produire vite et collaborer efficacement."
apropos_3: Aujourd'hui disponible pour un CDI, je cherche une structure où la communication est prise au sérieux, un lieu où je peux continuer à apprendre et à m'investir pleinement.
