<style>
.exp-card{cursor:pointer}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#FFCD00;
  --yellow-dark:#E6B800;
  --yellow-soft:#FFF8D6;
  --yellow-mid:#FFF3B0;
  --dark:#272727;
  --dark2:#3A3A3A;
  --text:#272727;
  --muted:#6B6B6B;
  --muted-light:#9A9A9A;
  --white:#FFFFFF;
  --light:#F7F7F5;
  --border:#E8E8E4;
  --border-strong:#D0D0CA;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 4px rgba(39,39,39,.07),0 1px 2px rgba(39,39,39,.05);
  --shadow-md:0 4px 16px rgba(39,39,39,.1),0 2px 4px rgba(39,39,39,.06);
  --shadow-yellow:0 6px 20px rgba(255,205,0,.35);
}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--white);color:var(--text);line-height:1.6;overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.nav-logo img{width:32px;height:32px;object-fit:contain}
.nav-logo-text{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1rem;color:var(--dark);letter-spacing:-.01em}
.nav-logo-text span{color:var(--yellow-dark)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--dark)}
.nav-cta{background:var(--yellow);color:var(--dark);padding:.5rem 1.25rem;border-radius:100px;font-size:.85rem;font-weight:700;text-decoration:none;transition:background .2s,transform .2s,box-shadow .2s}
.nav-cta:hover{background:var(--yellow-dark);transform:translateY(-1px);box-shadow:var(--shadow-yellow)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--dark);border-radius:2px;transition:.3s}

/* FOCUS VISIBLE — ACCESSIBILITE */
a:focus-visible,button:focus-visible{
  outline:2px solid var(--yellow);
  outline-offset:3px;
  border-radius:4px;
}

/* HERO */
#hero{min-height:100vh;display:flex;align-items:center;padding:8rem 5% 5rem;background:var(--white);position:relative;overflow:hidden}
.hero-accent-bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--yellow)}
.hero-shape{position:absolute;right:-5%;top:5%;width:50%;height:90%;background:var(--light);border-radius:24px;transform:rotate(3deg);z-index:0}
.hero-dots{position:absolute;right:6%;top:18%;width:280px;height:280px;opacity:.35;background-image:radial-gradient(var(--yellow-dark) 1.5px,transparent 1.5px);background-size:22px 22px;z-index:1;pointer-events:none}
.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;width:100%;position:relative;z-index:2;max-width:1200px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow-soft);border:1.5px solid var(--yellow);padding:.38rem 1rem;border-radius:100px;font-size:.78rem;color:var(--dark);font-weight:600;margin-bottom:1.75rem}
.hero-badge-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h1.hero-title{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(2.4rem,5vw,4rem);font-weight:800;line-height:1.1;letter-spacing:-.025em;color:var(--dark);margin-bottom:1.25rem}
h1.hero-title em{font-style:normal;background:var(--yellow);padding:0 .15em;border-radius:4px}
.hero-sub{font-size:1.02rem;color:var(--muted);max-width:500px;margin-bottom:2rem;line-height:1.75;font-weight:300}
.hero-actions{display:flex;gap:.875rem;flex-wrap:wrap;margin-bottom:2.5rem}
.btn-primary{background:var(--yellow);color:var(--dark);padding:.8rem 1.75rem;border-radius:100px;font-size:.92rem;font-weight:700;text-decoration:none;transition:background .2s,transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:.5rem;border:2px solid var(--yellow)}
.btn-primary:hover{background:var(--yellow-dark);border-color:var(--yellow-dark);transform:translateY(-2px);box-shadow:var(--shadow-yellow)}
.btn-secondary{background:var(--white);color:var(--dark);padding:.8rem 1.75rem;border-radius:100px;font-size:.92rem;font-weight:600;text-decoration:none;border:2px solid var(--dark);transition:background .2s,transform .2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-secondary:hover{background:var(--dark);color:var(--yellow);transform:translateY(-2px)}
.hero-stats{display:flex;gap:2.5rem;padding-top:2rem;border-top:1px solid var(--border);flex-wrap:wrap}
.stat-num{font-family:'Bricolage Grotesque',sans-serif;font-size:1.8rem;font-weight:800;color:var(--dark)}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.hero-photo-wrap{display:flex;justify-content:center;align-items:center}
.hero-photo-frame{position:relative;width:320px;height:390px}
.hero-photo-bg{position:absolute;inset:14px 0 0 14px;background:var(--yellow);border-radius:20px;opacity:.5}
.hero-photo{width:100%;height:100%;object-fit:cover;border-radius:20px;position:relative;z-index:1;box-shadow:var(--shadow-md)}
.hero-photo-badge{position:absolute;bottom:-16px;left:-16px;z-index:2;background:var(--dark);color:var(--yellow);border-radius:var(--radius);padding:.75rem 1.1rem;box-shadow:var(--shadow-md);font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:.5rem;font-family:'Bricolage Grotesque',sans-serif}

/* SECTIONS */
section{padding:6rem 5%}
.section-inner{max-width:1200px;margin:0 auto}
.section-label{font-size:.72rem;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:.75rem;display:flex;align-items:center;gap:.6rem}
.section-label::before{content:'';display:inline-block;width:20px;height:2px;background:var(--yellow);border-radius:2px}
h2.section-title{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.7rem,3vw,2.4rem);font-weight:800;letter-spacing:-.025em;color:var(--dark);margin-bottom:.75rem}
.section-intro{color:var(--muted);font-size:.97rem;line-height:1.75;margin-bottom:3rem;max-width:540px;font-weight:300}

/* EXPERIENCES */
#experiences{background:var(--light)}
.exp-grid{display:grid;gap:1.25rem}
.exp-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:2rem;display:grid;grid-template-columns:1fr auto;gap:1.5rem;box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s,border-color .25s;position:relative;overflow:hidden}
.exp-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.exp-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--exp-bar-color, var(--yellow));transform:scaleY(0);transform-origin:bottom;transition:transform .3s}
.exp-card:hover::after{transform:scaleY(1)}
.exp-logo{width:42px;height:42px;object-fit:contain;border-radius:8px;border:1px solid var(--border);padding:4px;background:var(--white);flex-shrink:0}
.exp-header{display:flex;align-items:flex-start;gap:.875rem;margin-bottom:.75rem;flex-wrap:wrap}
.exp-role{font-family:'Bricolage Grotesque',sans-serif;font-size:1.08rem;font-weight:700;color:var(--dark);margin-bottom:.2rem}
.exp-company{color:var(--dark2);font-size:.85rem;font-weight:600}
.exp-missions{list-style:none;display:flex;flex-direction:column;gap:.35rem;margin-top:.75rem}
.exp-missions li{font-size:.86rem;color:var(--muted);padding-left:1.1rem;position:relative;line-height:1.55}
.exp-missions li::before{content:'';position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--exp-bar-color, var(--yellow));border:1.5px solid var(--exp-bar-color, var(--yellow-dark));transition:background .3s ease,border-color .3s ease}
.exp-meta{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;flex-shrink:0;min-width:120px}
.exp-period{font-size:.78rem;color:var(--muted);text-align:right;line-height:1.4}
.exp-type{font-size:.72rem;font-weight:700;padding:.3rem .75rem;border-radius:6px;white-space:nowrap;text-align:center}
.type-cdd{background:#FEF3C7;color:#92400E}
.type-alt{background:var(--yellow-soft);color:var(--dark);border:1px solid var(--yellow)}
.type-stage{background:#F0FDF4;color:#166534}
.type-benevolat{background:#F5F3FF;color:#5B21B6}

/* REALISATIONS */
#realisations{background:var(--white)}
.real-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.25rem;margin-bottom:3rem}
.real-card{background:var(--light);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.75rem;transition:box-shadow .2s,transform .2s,border-color .2s}
.real-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--yellow)}
.real-icon{width:42px;height:42px;background:var(--yellow);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
.real-icon svg{width:20px;height:20px;stroke:var(--dark);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.real-tag{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.4rem}
.real-title{font-family:'Bricolage Grotesque',sans-serif;font-size:.97rem;font-weight:700;color:var(--dark);margin-bottom:.5rem}
.real-desc{font-size:.84rem;color:var(--muted);line-height:1.65}
.real-link{display:inline-flex;align-items:center;gap:.3rem;color:var(--dark);font-size:.82rem;font-weight:700;text-decoration:none;margin-top:.875rem;border-bottom:2px solid var(--yellow);padding-bottom:1px;transition:gap .2s}
.real-link:hover{gap:.55rem}
.articles-label{font-size:.72rem;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.articles-label::before{content:'';display:inline-block;width:20px;height:2px;background:var(--yellow);border-radius:2px}
.articles-list{list-style:none;display:flex;flex-direction:column;gap:.75rem}
.articles-list li a{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--light);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.25rem;text-decoration:none;color:var(--body);font-size:.88rem;font-weight:500;transition:border-color .2s,background .2s}
.articles-list li a:hover{border-color:var(--yellow);background:var(--yellow-soft)}
.articles-list li a svg{width:14px;height:14px;stroke:var(--muted-light);flex-shrink:0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* COMPETENCES */
#competences{background:var(--dark)}
#competences .section-label{color:var(--muted-light)}
#competences .section-label::before{background:var(--yellow)}
#competences h2.section-title{color:var(--white)}
#competences .section-intro{color:#9A9A9A}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
.skill-cat{background:#333333;border:1px solid #404040;border-radius:var(--radius);padding:1.75rem}
.skill-cat-title{font-family:'Bricolage Grotesque',sans-serif;font-size:.92rem;font-weight:700;color:var(--white);margin-bottom:1.1rem;padding-bottom:.75rem;border-bottom:1px solid #404040}
.skill-pills{display:flex;flex-wrap:wrap;gap:.45rem}
.skill-pill{background:#272727;border:1px solid #484848;border-radius:100px;padding:.3rem .8rem;font-size:.79rem;color:#C8C8C8;display:inline-flex;align-items:center;gap:.35rem;transition:border-color .2s,background .2s,color .2s}
.skill-pill:hover{border-color:var(--yellow);background:#3A3A2A;color:var(--yellow)}
.skill-years{font-size:.7rem;color:var(--yellow);font-weight:700}

/* Skill pills — hover couleur marque */
.skill-pill[data-brand]:hover{border-color:var(--brand-color);color:var(--brand-color)}
.skill-pill[data-brand]:hover .skill-years{color:var(--brand-color)}
/* Couleurs claires — texte sombre au hover */
.skill-pill[data-brand="arena"]:hover,.skill-pill[data-brand="thot"]:hover{color:var(--dark)}
.skill-pill[data-brand="arena"]:hover .skill-years,.skill-pill[data-brand="thot"]:hover .skill-years{color:var(--dark)}

/* A PROPOS */
#apropos{background:var(--white)}
.apropos-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:5rem;align-items:start}
.apropos-text p{color:var(--muted);line-height:1.8;margin-bottom:1.25rem;font-size:.97rem;font-weight:300}
.apropos-text p strong{color:var(--dark);font-weight:600}
.soft-skills{display:flex;flex-direction:column;gap:.875rem}
.soft-skill{
  background:var(--light);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:1.1rem 1.4rem 1.1rem calc(1.4rem + 4px);
  position:relative;
  overflow:hidden;
}
.soft-skill::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--yellow);
  z-index:3;
  transition:opacity .3s ease;
}
.soft-skill::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:#272727;
  transform:translateX(100%);
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  z-index:1;
}
.soft-skill:hover::before{
  opacity:0;
}
.soft-skill:hover::after{
  transform:translateX(0);
}
.soft-skill-title,.soft-skill-desc{position:relative;z-index:2}
.soft-skill:hover .soft-skill-title{color:var(--white)}
.soft-skill:hover .soft-skill-desc{color:rgba(255,255,255,.7)}
.soft-skill-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.9rem;margin-bottom:.3rem;color:var(--dark);transition:color .4s ease}
.soft-skill-desc{font-size:.82rem;color:var(--muted);line-height:1.6;transition:color .4s ease}

/* CONTACT */
#contact{background:var(--light)}
.contact-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:5rem;align-items:start}
.contact-info p{color:var(--muted);margin-bottom:2rem;line-height:1.75;font-size:.97rem;font-weight:300}
.contact-links{display:flex;flex-direction:column;gap:.75rem}
.contact-link{display:flex;align-items:center;gap:.875rem;color:var(--dark);text-decoration:none;padding:.875rem 1.1rem;background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.88rem;font-weight:500;transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow)}
.contact-link:hover{border-color:var(--yellow);box-shadow:var(--shadow-yellow)}
.contact-link-icon{width:34px;height:34px;border-radius:8px;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-link-icon svg{width:16px;height:16px;stroke:var(--dark);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.contact-form{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.form-group label{font-size:.78rem;color:var(--dark);font-weight:600}
.form-group .req{color:var(--yellow-dark)}
.form-group input,.form-group textarea{background:var(--light);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .9rem;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;transition:border-color .2s,box-shadow .2s;outline:none;resize:none;width:100%}
.form-group input:focus,.form-group textarea:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,205,0,.15);background:var(--white)}
.form-group textarea{min-height:100px}
.rgpd-block{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:1.25rem;padding:.875rem;background:var(--yellow-soft);border-radius:var(--radius-sm);border:1.5px solid var(--yellow)}
.rgpd-block input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--dark);cursor:pointer}
.rgpd-block label{font-size:.77rem;color:var(--dark2);line-height:1.55;cursor:pointer}
.form-submit{background:var(--yellow);color:var(--dark);border:none;border-radius:100px;padding:.8rem 1.75rem;font-size:.9rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s;width:100%}
.form-submit:hover{background:var(--yellow-dark);transform:translateY(-1px);box-shadow:var(--shadow-yellow)}
.form-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

/* HOVER LOGOS CONTACT */
.contact-link-icon{position:relative;overflow:hidden;transition:background .3s ease}
.contact-link-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;opacity:0;transition:opacity .25s ease;z-index:2}
.contact-link-icon svg{transition:opacity .25s ease, transform .3s ease;position:relative;z-index:1}
.contact-link:hover .contact-link-icon img{opacity:1}
.contact-link:hover .contact-link-icon svg{opacity:0}

/* Gmail — bordure dégradé Google */
.contact-link.link-gmail{position:relative;z-index:1;background:var(--white)}
.contact-link.link-gmail::after{
  content:'';
  position:absolute;
  inset:-1.5px;
  border-radius:calc(var(--radius-sm) + 1.5px);
  border:1.5px solid transparent;
  background:linear-gradient(135deg, #4181ED, #C0211F, #E44134, #F4B605, #32A350) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  opacity:0;
  transition:opacity .3s ease;
  pointer-events:none;
}
.contact-link.link-gmail:hover{
  border-color:transparent;
  box-shadow:0 4px 15px rgba(65,129,237,.2);
}
.contact-link.link-gmail:hover::after{
  opacity:1;
}
.contact-link:hover .icon-gmail{background:transparent}

/* LinkedIn — bordure bleue */
.contact-link.link-linkedin:hover{border-color:#007AB5;box-shadow:0 4px 15px rgba(0,122,181,.25)}
.contact-link:hover .icon-linkedin{background:#FFFFFF;border:2px solid transparent}

/* Téléphone — bordure verte */
.contact-link.link-tel:hover{border-color:#22C55E;box-shadow:0 4px 15px rgba(34,197,94,.25)}
.contact-link:hover .icon-tel{background:#22C55E}

/* CV — bordure orange */
.contact-link.link-cv:hover{border-color:#F97316;box-shadow:0 4px 15px rgba(249,115,22,.25)}
.contact-link:hover .icon-cv{background:#F97316}

/* ANIMATIONS ICONES TEL & CV */
.contact-link:hover .icon-tel svg{
  opacity:1;
  animation:phone-ring .6s ease;
}
.contact-link:hover .icon-cv svg{
  opacity:1;
  animation:cv-download .6s ease;
}
@keyframes phone-ring{
  0%{transform:rotate(0) scale(1)}
  10%{transform:rotate(15deg) scale(1.1)}
  20%{transform:rotate(-15deg) scale(1.1)}
  30%{transform:rotate(12deg) scale(1.05)}
  40%{transform:rotate(-12deg) scale(1.05)}
  50%{transform:rotate(8deg) scale(1)}
  60%{transform:rotate(-8deg)}
  70%{transform:rotate(4deg)}
  80%{transform:rotate(-4deg)}
  100%{transform:rotate(0) scale(1)}
}
@keyframes cv-download{
  0%{transform:translateY(0)}
  20%{transform:translateY(-6px)}
  40%{transform:translateY(3px)}
  55%{transform:translateY(-3px)}
  70%{transform:translateY(1px)}
  85%{transform:translateY(-1px)}
  100%{transform:translateY(0)}
}

/* FOOTER */
footer{padding:2rem 5%;border-top:4px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;background:var(--dark)}
.footer-copy{font-size:.8rem;color:#9A9A9A}
.footer-links{display:flex;gap:1.5rem}
.footer-links a{font-size:.8rem;color:#9A9A9A;text-decoration:none;transition:color .2s}
.footer-links a:hover{color:var(--yellow)}

/* ANIMATIONS */
.fade-in{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}

/* CURSOR TRAIL */
canvas#trailCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
@media(max-width:960px){canvas#trailCanvas{display:none}}

/* TRANSITION DE PAGE */
.page-transition{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;pointer-events:none;display:flex;overflow:hidden}
.page-transition-bar{position:relative;flex:1 1 0;min-width:0;transform:scaleY(0);will-change:transform;backface-visibility:hidden;transform-style:preserve-3d}
.page-transition-bar::after{content:'';position:absolute;top:0;right:-2px;width:4px;height:100%;background:inherit}
.page-transition-bar:last-child::after{display:none}
.page-transition.leaving .page-transition-bar{transform:scaleY(1);transform-origin:bottom}
.page-transition.covered .page-transition-bar{transform:scaleY(1);transform-origin:top}
.page-transition.entering .page-transition-bar{transform:scaleY(0);transform-origin:top}
